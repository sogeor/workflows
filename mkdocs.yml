site_name: sogeor workflows
site_description: Reusable GitHub Actions workflows for the sogeor platform
repo_url: https://github.com/sogeor/workflows
repo_name: sogeor/workflows
edit_uri: edit/master/docs/
copyright: Copyright &copy; sogeor. Licensed under Apache-2.0.
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Repository setup: setup.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Operations: operations.md
  - Architecture: architecture.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Workflows and actions: reference/workflows.md
  - Decisions:
      - Overview: adr/index.md
      - "0001 Record architecture decisions": adr/0001-record-architecture-decisions.md
      - "0002 Versioning and pinning": adr/0002-versioning-and-pinning.md
      - "0003 Environment-scoped credentials": adr/0003-environment-scoped-credentials.md
      - "0004 Mesh access for CI": adr/0004-mesh-access-for-ci.md
      - "0005 Actions from the same commit": adr/0005-shared-actions-from-the-same-commit.md
