name: ansible-lint
# Checks for pull requests; needs no secrets and no access to the servers.
on:
  workflow_call:
    inputs:
      ansible-core-version:
        type: string
        default: "2.21.5"
      ansible-lint-version:
        type: string
        default: "26.10.1"
      playbooks:
        type: string
        default: site.yml status.yml
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Install
        env:
          ANSIBLE_CORE_VERSION: ${{ inputs.ansible-core-version }}
          ANSIBLE_LINT_VERSION: ${{ inputs.ansible-lint-version }}
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
          PIPX_HOME: ${{ runner.temp }}/pipx
        run: |
          # Own pipx home: the runner image ships its own ansible-core in a root-owned /opt/pipx.
          export PATH="$PIPX_BIN_DIR:$PATH"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          pipx install "ansible-core==${ANSIBLE_CORE_VERSION}"
          pipx inject ansible-core "ansible-lint==${ANSIBLE_LINT_VERSION}" --include-apps
          ansible --version | head -1
          ansible-galaxy collection install --no-cache -r requirements.yml
      - name: Syntax check
        env: { PLAYBOOKS: "${{ inputs.playbooks }}" }
        # Static inventory: the tofu inventory needs secrets
        run: for p in $PLAYBOOKS; do ansible-playbook -i localhost, --syntax-check "$p"; done
      - name: ansible-lint
        run: ansible-lint
