name: ansible-lint
# Checks for pull requests; needs no secrets and no access to the servers.
on:
  workflow_call:
    inputs:
      ansible-core-version:
        type: string
        default: "2.19.3"
      ansible-lint-version:
        type: string
        default: "25.9.2"
      playbooks:
        type: string
        default: site.yml status.yml
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Install
        env:
          ANSIBLE_CORE_VERSION: ${{ inputs.ansible-core-version }}
          ANSIBLE_LINT_VERSION: ${{ inputs.ansible-lint-version }}
        run: |
          pipx install "ansible-core==${ANSIBLE_CORE_VERSION}"
          pipx inject ansible-core "ansible-lint==${ANSIBLE_LINT_VERSION}" --include-apps
          ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        env: { PLAYBOOKS: "${{ inputs.playbooks }}" }
        # Static inventory: the tofu inventory needs secrets
        run: for p in $PLAYBOOKS; do ansible-playbook -i localhost, --syntax-check "$p"; done
      - name: ansible-lint
        run: ansible-lint
