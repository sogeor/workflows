name: ansible-test
# Molecule tests in Docker containers with systemd; needs no secrets and no access to the servers.
on:
  workflow_call:
    inputs:
      ansible-core-version:
        type: string
        default: "2.21.5"
      community-docker-version:
        type: string
        default: "5.4.0"
      molecule-plugins-version:
        type: string
        default: "26.10.12"
      molecule-version:
        type: string
        default: "26.10.0"
      scenario:
        type: string
        default: default
permissions: { contents: read }
jobs:
  molecule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Install
        env:
          ANSIBLE_CORE_VERSION: ${{ inputs.ansible-core-version }}
          COMMUNITY_DOCKER_VERSION: ${{ inputs.community-docker-version }}
          MOLECULE_PLUGINS_VERSION: ${{ inputs.molecule-plugins-version }}
          MOLECULE_VERSION: ${{ inputs.molecule-version }}
        run: |
          # --force: runner images ship their own ansible-core in pipx
          pipx install --force "ansible-core==${ANSIBLE_CORE_VERSION}"
          pipx inject ansible-core "molecule==${MOLECULE_VERSION}" --include-apps
          pipx inject ansible-core "molecule-plugins[docker]==${MOLECULE_PLUGINS_VERSION}"
          ansible --version | head -1
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install "community.docker:==${COMMUNITY_DOCKER_VERSION}"
      - name: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SCENARIO: ${{ inputs.scenario }}
        run: molecule test -s "$SCENARIO"
