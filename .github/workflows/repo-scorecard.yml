name: repo-scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [master]

permissions: {}

jobs:
  scorecard:
    name: scorecard
    uses: ./.github/workflows/scorecard.yml
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      scorecard-token: ${{ secrets.SCORECARD_TOKEN }}
