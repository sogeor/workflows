name: docs

on:
  workflow_call:
    inputs:
      markdown-globs:
        description: Newline-separated globs checked by markdownlint.
        type: string
        default: |
          *.md
          docs/**/*.md
          .github/**/*.md
      link-paths:
        description: Space-separated quoted paths checked by lychee.
        type: string
        default: "'*.md' 'docs/**/*.md' '.github/**/*.md'"
      link-args:
        description: Extra lychee arguments, for example exclusions.
        type: string
        default: ""
      mkdocs:
        description: Build the MkDocs site with --strict.
        type: boolean
        default: true
      requirements:
        description: Hash-locked requirements file with MkDocs and plugins.
        type: string
        default: .github/requirements-docs.txt

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ inputs.markdown-globs }}

      - name: lychee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude-path site
            ${{ inputs.link-args }}
            ${{ inputs.link-paths }}
          fail: true

      - name: mkdocs build --strict
        if: inputs.mkdocs
        env:
          REQUIREMENTS: ${{ inputs.requirements }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet --require-hashes -r "$REQUIREMENTS"
          python3 -m mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
