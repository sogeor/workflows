name: self-test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    uses: ./.github/workflows/docs.yml
    with:
      link-args: >-
        --exclude '^https://github\.com/sogeor/workflows/(security|issues/new|releases)'

  security-lite:
    name: security-lite
    uses: ./.github/workflows/security-lite.yml
    permissions:
      contents: read
      security-events: write
    with:
      checkov: true
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  scorecard:
    name: scorecard
    uses: ./.github/workflows/scorecard.yml
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    with:
      publish-results: false
      upload-sarif: false

  actions:
    name: actions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: export-env
        uses: ./actions/export-env
        with:
          vars-json: '{"PLAIN": "  value \t", "PEM": "line1\nline2"}'
          vars: PLAIN PEM
          dotenv: |
            # fixture
            TOKEN=fixture-secret
            URL = https://example.com/a=b

      - name: Check export-env
        run: |
          set -euo pipefail
          test "$PLAIN" = value
          test "$PEM" = "$(printf 'line1\nline2')"
          test "$TOKEN" = fixture-secret
          test "$URL" = https://example.com/a=b

      - name: setup-tofu-http-backend
        uses: ./actions/setup-tofu-http-backend
        with:
          project-id: "12345"
          state-name: fixture
          username: fixture-user
          token: fixture-token

      - name: Check setup-tofu-http-backend
        run: |
          set -euo pipefail
          test "$TF_HTTP_ADDRESS" = https://gitlab.com/api/v4/projects/12345/terraform/state/fixture
          test "$TF_HTTP_LOCK_ADDRESS" = "${TF_HTTP_ADDRESS}/lock"
          test "$TF_HTTP_UNLOCK_METHOD" = DELETE
          test "$TF_HTTP_PASSWORD" = fixture-token

      - name: setup-mesh rejects an unknown mode
        id: mesh
        continue-on-error: true
        uses: ./actions/setup-mesh
        with:
          mode: fixture

      - name: export-env rejects a malformed line
        id: dotenv-malformed
        continue-on-error: true
        uses: ./actions/export-env
        with:
          dotenv: NO_EQUALS_SIGN

      - name: export-env rejects a reserved name
        id: dotenv-reserved
        continue-on-error: true
        uses: ./actions/export-env
        with:
          dotenv: GITHUB_TOKEN=fixture

      - name: export-env rejects an empty value
        id: dotenv-empty
        continue-on-error: true
        uses: ./actions/export-env
        with:
          dotenv: EMPTY=

      - name: export-env rejects a missing variable
        id: vars-missing
        continue-on-error: true
        uses: ./actions/export-env
        with:
          vars: MISSING

      - name: setup-tofu-http-backend rejects a non-numeric project
        id: backend-project
        continue-on-error: true
        uses: ./actions/setup-tofu-http-backend
        with:
          project-id: group/project
          state-name: fixture
          username: fixture-user
          token: fixture-token

      - name: setup-tofu-http-backend rejects plain http
        id: backend-http
        continue-on-error: true
        uses: ./actions/setup-tofu-http-backend
        with:
          project-id: "12345"
          state-name: fixture
          username: fixture-user
          token: fixture-token
          gitlab-url: http://gitlab.example.com

      - name: setup-mesh requires WireGuard settings
        id: mesh-settings
        continue-on-error: true
        uses: ./actions/setup-mesh
        with:
          mode: wireguard

      - name: pr-comment rejects an invalid marker
        id: comment-marker
        continue-on-error: true
        uses: ./actions/pr-comment
        with:
          marker: "bad marker"
          body-file: README.md
          pr-number: "1"

      - name: Check rejections
        env:
          OUTCOMES: >-
            ${{ steps.mesh.outcome }}
            ${{ steps.dotenv-malformed.outcome }}
            ${{ steps.dotenv-reserved.outcome }}
            ${{ steps.dotenv-empty.outcome }}
            ${{ steps.vars-missing.outcome }}
            ${{ steps.backend-project.outcome }}
            ${{ steps.backend-http.outcome }}
            ${{ steps.mesh-settings.outcome }}
            ${{ steps.comment-marker.outcome }}
        run: |
          set -euo pipefail
          for outcome in $OUTCOMES; do
            if [[ "$outcome" != failure ]]; then
              echo "::error::Expected every negative case to fail; got: ${OUTCOMES}"
              exit 1
            fi
          done
          echo "all negative cases rejected"

      - name: pr-comment skips outside pull requests
        if: github.event_name != 'pull_request'
        uses: ./actions/pr-comment
        with:
          marker: self-test
          body-file: README.md
