name: scorecard

on:
  workflow_call:
    inputs:
      publish-results:
        description: Publish results to the OpenSSF Scorecard API (badge and viewer).
        type: boolean
        default: true
      upload-sarif:
        description: Upload results to GitHub code scanning.
        type: boolean
        default: true
    secrets:
      scorecard-token:
        description: Fine-grained PAT with Administration read-only; enables the Branch-Protection check.
        required: false

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
          repo_token: ${{ secrets.scorecard-token || github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - if: inputs.upload-sarif
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
