name: release
on:
  workflow_call:
    outputs:
      released: { value: "${{ jobs.release-please.outputs.released }}" }
      tag: { value: "${{ jobs.release-please.outputs.tag }}" }
      version: { value: "${{ jobs.release-please.outputs.version }}" }
permissions: { contents: read }
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # Source archive of the release with signed SLSA build provenance (OpenSSF Scorecard Signed-Releases).
  provenance:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Source archive and checksums
        id: archive
        env:
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          name="$REPO-$VERSION"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.archive.outputs.name }}.tar.gz
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          permission-contents: write
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: Upload to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NAME: ${{ steps.archive.outputs.name }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cp "$BUNDLE" "$NAME.tar.gz.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "$NAME.tar.gz.intoto.jsonl"
          gh release upload "$TAG" --clobber -R "$GITHUB_REPOSITORY" \
            "$NAME.tar.gz" "$NAME.tar.gz.sigstore.json" "$NAME.tar.gz.intoto.jsonl" SHA256SUMS
